<!DOCTYPE html>
<html>
    <title>Function Demo</title>
    <head>
        <h1> Function Demonstration</h1>
    <script type="text/javascript">
        function my_fun(){
            document.write("<hr>");
document.write("this is my <b>statement </b>after the function call");
        }
    </script>
    </head>
    <body>
        <center>
            <script type="text/javascript">
                document.write("this is the statement before function calls");
                document.write("<br>");
                my_fun();
            </script>
        </center>
    </body>
</html>
